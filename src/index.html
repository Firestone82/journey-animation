<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Route Reel</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#14231e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
  <script>
    // Apply the stored theme before Angular boots to avoid a colour flash.
    (function () {
      try {
        var pref = localStorage.getItem('route-reel:theme');
        var dark = pref === 'dark' ||
          ((!pref || pref === 'auto') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) { /* default (dark) tokens apply */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
