<div class="shell">
  <aside class="panel">
    <header class="masthead">
      <div class="masthead-text">
        <span class="masthead-eyebrow">Trip playback</span>
        <h1>Route Reel</h1>
        <p class="masthead-sub">Draw a route, then replay the ride.</p>
      </div>
      <app-theme-toggle />
    </header>

    <app-mode-switcher />
    <app-route-summary />
    <app-route-browser />
    <app-playback-controls />
    <app-journey-library />

    <footer class="panel-foot">
      Routing © OSRM demo servers · Map © OpenStreetMap contributors
    </footer>
  </aside>

  <main class="map-wrap">
    <app-route-map class="map-fill" />
  </main>
</div>
