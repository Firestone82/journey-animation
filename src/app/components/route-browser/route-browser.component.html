@if (trip.hasRoute() && trip.legs().length) {
  <section
    class="browser"
    [class.dock-right]="dock() === 'right'"
    [style.transform]="'translateY(' + offsetY() + 'px)'">
    <header class="browser-head" (pointerdown)="startDrag($event)" title="Drag to move up/down">
      <h2 class="block-title">Route</h2>
      <span class="drag-grip" aria-hidden="true">⋮⋮</span>
      <button
        type="button"
        class="dock-btn"
        (click)="toggleDock()"
        [attr.aria-label]="dock() === 'left' ? 'Move panel to the right side' : 'Move panel to the left side'"
        [title]="dock() === 'left' ? 'Move to right side' : 'Move to left side'">
        {{ dock() === 'left' ? '⇥' : '⇤' }}
      </button>
    </header>

    <div class="browser-body">
      @for (p of pinIndices(); track p) {
        <div class="pin-row" (contextmenu)="onPinMenu(p, $event)">
          <span
            class="pin-chip"
            [class.pin-start]="p === 0"
            [class.pin-end]="p === pinIndices().length - 1">
            {{ trip.pinLabel(p) }}
          </span>
          <span class="pin-name">{{ pinName(p) }}</span>
          <button
            type="button"
            class="mini-btn"
            (click)="onPinMenu(p, $event)"
            [attr.aria-label]="'Options for ' + pinName(p) + ' (reorder, remove)'"
            title="Options — reorder, remove">
            ⋯
          </button>
        </div>

        @if (p < trip.legs().length) {
          <div
            class="leg-row"
            [class.is-hovered]="trip.hoveredLeg() === p"
            (mouseenter)="trip.highlightLeg(p)"
            (mouseleave)="trip.highlightLeg(null)"
            (contextmenu)="onLegMenu(p, $event)">
            <span class="leg-bar" aria-hidden="true"></span>
            <button
              type="button"
              class="leg-main"
              (click)="trip.focusLeg(p)"
              title="Click to zoom to this leg">
              <span class="leg-icon" aria-hidden="true">{{ legIcon(trip.legs()[p].modeId) }}</span>
              <span class="leg-text">
                {{ km(trip.legs()[p].distance) | number: '1.1-1' }} km ·
                {{ fmtDuration(trip.legs()[p].time) }}
              </span>
              @if (speedBadge(p)) {
                <span class="leg-speed">{{ speedBadge(p) }}</span>
              }
            </button>
            <button
              type="button"
              class="mini-btn"
              (click)="onLegMenu(p, $event)"
              [attr.aria-label]="'Change path type or speed for this leg'"
              title="Change path type / speed">
              ⋯
            </button>
          </div>
        }
      }
    </div>
    <span class="resize-hint" aria-hidden="true" title="Drag the corner to resize"></span>
  </section>
}
